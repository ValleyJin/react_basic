services:
  postgres:
    image: postgres:16-alpine
    container_name: beanlog-lesson12-postgres
    environment:
      POSTGRES_USER: beanlog
      POSTGRES_PASSWORD: beanlog
      POSTGRES_DB: beanlog_lesson12
    ports:
      - "5435:5432"
    volumes:
      - lesson12_pgdata:/var/lib/postgresql/data

volumes:
  lesson12_pgdata:
