services:
  postgres:
    image: postgres:16-alpine
    container_name: beanlog-lesson08-postgres
    environment:
      POSTGRES_USER: beanlog
      POSTGRES_PASSWORD: beanlog
      POSTGRES_DB: beanlog_lesson08
    ports:
      - "5433:5432"
    volumes:
      - lesson08_pgdata:/var/lib/postgresql/data

volumes:
  lesson08_pgdata:
