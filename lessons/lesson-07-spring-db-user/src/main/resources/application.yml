# 기본값은 로컬 Docker Compose(postgres)와 맞춤. 다른 환경에서는 환경 변수로 덮어쓴다.
spring:
  application:
    name: lesson-07-spring-db-user
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beanlog_lesson07}
    username: ${SPRING_DATASOURCE_USERNAME:beanlog}
    password: ${SPRING_DATASOURCE_PASSWORD:beanlog}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: debug
