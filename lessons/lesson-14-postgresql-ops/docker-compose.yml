services:
  postgres:
    image: postgres:16-alpine
    container_name: beanlog-lesson14-postgres
    environment:
      POSTGRES_USER: beanlog
      POSTGRES_PASSWORD: beanlog
      POSTGRES_DB: beanlog_lesson14
    ports:
      - "5437:5432"
    volumes:
      - lesson14_pgdata:/var/lib/postgresql/data

volumes:
  lesson14_pgdata:
